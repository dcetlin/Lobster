# Lobster Tier 2 Auditd Rules
# Minimal rule set for intrusion detection
# Based on CIS Benchmarks and standard auditd guidance

## First rule - delete all existing rules
-D

## Increase the buffers to survive stress events
-b 8192

## Set failure mode to syslog (1) instead of panic (2)
-f 1

## Set backlog wait time (milliseconds)
--backlog_wait_time 60000

## Log rate limit (per minute, 0 = unlimited)
-r 0

## ============================================
## WATCH: System Configuration Files
## ============================================

# Monitor /etc/passwd for changes
-w /etc/passwd -p wa -k syscfg_passwd

# Monitor /etc/group for changes
-w /etc/group -p wa -k syscfg_group

# Monitor /etc/shadow for changes
-w /etc/shadow -p wa -k syscfg_shadow

# Monitor /etc/sudoers
-w /etc/sudoers -p wa -k syscfg_sudoers

# Monitor /etc/sudoers.d/ and all files within
-w /etc/sudoers.d/ -p wa -k syscfg_sudoers_d

# Monitor SSH server configuration
-w /etc/ssh/sshd_config -p wa -k syscfg_sshd_config

# Monitor SSH server configuration directory
-w /etc/ssh/sshd_config.d/ -p wa -k syscfg_sshd_config_d

## ============================================
## WATCH: Authorized Keys
## ============================================

# Monitor root's authorized_keys
-w /root/.ssh/authorized_keys -p wa -k auth_keys_root

# Monitor lobster user's authorized_keys
-w /home/lobster/.ssh/authorized_keys -p wa -k auth_keys_lobster

## ============================================
## KERNEL: Module Load/Unload
## ============================================

# Monitor kernel module loading
-a always,exit -F arch=x86_64 -S init_module,finit_module,delete_module -k kernel_modules
-a always,exit -F arch=i686 -S init_module,finit_module,delete_module -k kernel_modules

## ============================================
## OPTIONAL: Root Command Execution
## ============================================
# This rule logs sudo commands by normal users (auid >= 1000)
# WARNING: Can be noisy if lots of sudo is used. Enable only after tuning.
# -a always,exit -F arch=x86_64 -S execve -F euid=0 -F auid>=1000 -k root_commands
# -a always,exit -F arch=i686 -S execve -F euid=0 -F auid>=1000 -k root_commands

## ============================================
## Make the rules active immediately
## ============================================
-e 2
