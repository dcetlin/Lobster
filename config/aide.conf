# Lobster Tier 2 AIDE Configuration
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
gzip_dbout=yes

# Define attribute groups
Checksums = sha256
OwnerMode = p+u+g+ftype
Size = s+b
InodeData = OwnerMode+n+i+Size+l+X
StaticFile = m+c+Checksums
Full = InodeData+StaticFile
R = Full

# Monitor critical system directories
/etc R
/usr/bin R
/usr/sbin R
/lib/systemd R
/etc/systemd R

# Home directory - Lobster code only (exclude runtime data)
!/home/lobster/.git
!/home/lobster/lobster-workspace/data
!/home/lobster/lobster-workspace/logs
!/home/lobster/lobster-workspace/scheduled-jobs/logs
!/home/lobster/lobster-workspace/scheduled-jobs/tasks
!/home/lobster/.venv
!/home/lobster/.cache
!/home/lobster/messages
!/home/lobster/lobster-user-config

/home/lobster/lobster R
