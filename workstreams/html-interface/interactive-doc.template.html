<!DOCTYPE html>
<!--
  INTERACTIVE DOC TEMPLATE
  ========================
  Encodes the Lobster interactive reading pattern:
    - Inline comment boxes (toggle on click) attached to any heading or block
    - Global comment textarea at the bottom
    - "Copy all comments" button that exports all non-empty comments as labeled text

  USAGE:
    1. Add class="comment-btn" buttons after headings or sections where you want comment UI
    2. Follow immediately with <div class="comment-area"><textarea placeholder="[label] "></textarea></div>
    3. The JS toggleComment() function handles open/close and focus
    4. The copyAllComments() function collects all filled textareas by placeholder label

  THEME:
    Supports dark mode via [data-theme="dark"] on <html>.
    Toggle via toggleTheme() or set localStorage key matching THEME_KEY below.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOC_TITLE}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #555;
    --accent: #1a73e8;
    --code-bg: #f5f5f5;
    --border: #ddd;
    --comment-bg: rgba(26, 115, 232, 0.05);
    --comment-border: rgba(26, 115, 232, 0.35);
  }
  [data-theme="dark"] {
    --bg: #1e1e1e;
    --fg: #e0e0e0;
    --muted: #aaa;
    --accent: #64b5f6;
    --code-bg: #2d2d2d;
    --border: #444;
    --comment-bg: rgba(100, 181, 246, 0.07);
    --comment-border: rgba(100, 181, 246, 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 16px;
    line-height: 1.65;
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    transition: background 0.2s, color 0.2s;
  }

  /* ── Theme toggle (fixed top-right) ── */
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--fg);
    z-index: 100;
  }

  /* ── Section comment toggle (end-of-section) ── */
  .section-comment-toggle {
    margin: 1rem 0 0.25rem;
    text-align: right;
  }

  /* ── Comment button (end-of-section toggle) ── */
  .comment-btn {
    cursor: pointer;
    font-size: 0.78em;
    opacity: 0.35;
    margin-left: 0.4em;
    background: none;
    border: none;
    vertical-align: middle;
    transition: opacity 0.15s;
    padding: 0;
    line-height: 1;
  }
  .comment-btn:hover { opacity: 1; }

  /* ── Inline comment area ── */
  .comment-area {
    display: none;
    margin: 0.4rem 0 0.9rem;
  }
  .comment-area.open { display: block; }
  .comment-area textarea {
    width: 100%;
    min-height: 56px;
    padding: 0.4rem 0.6rem;
    font-family: inherit;
    font-size: 0.84rem;
    border-radius: 4px;
    border: 1px solid var(--comment-border);
    background: var(--comment-bg);
    color: var(--fg);
    resize: vertical;
    outline: none;
  }
  .comment-area textarea:focus {
    border-color: var(--accent);
  }

  /* ── Global comment + copy button ── */
  .global-comment-section {
    margin: 2.5rem 0 0.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .global-comment-section label {
    font-size: 0.8rem;
    opacity: 0.6;
    display: block;
    margin-bottom: 0.4rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .global-comment-section textarea {
    width: 100%;
    min-height: 80px;
    padding: 0.5rem 0.7rem;
    font-family: inherit;
    font-size: 0.85rem;
    border-radius: 4px;
    border: 1px solid var(--comment-border);
    background: var(--comment-bg);
    color: var(--fg);
    resize: vertical;
  }
  .copy-btn-wrapper {
    text-align: center;
    margin: 1.25rem 0 2rem;
  }
  #copy-btn {
    padding: 0.5rem 1.75rem;
    cursor: pointer;
    font-size: 0.9rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }
  #copy-btn:hover { opacity: 0.88; }
  .version-stamp {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: right;
    margin-bottom: 1.5rem;
    opacity: 0.7;
  }
</style>
</head>
<body data-theme="light">

<button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button>

<!-- =====================================================================
     DOCUMENT CONTENT
     Place a .section-comment-toggle + .comment-area at the END of each section.
     The toggle carries a data-section attribute for addressability.
     Example:
       <h2 id="s1">Section Title</h2>
       [section content]
       <div class="section-comment-toggle" data-section="§1">
         <button class="comment-btn" onclick="toggleComment(this)">&#128172;</button>
       </div>
       <div class="comment-area"><textarea placeholder="[§1] "></textarea></div>
       <hr>
     ===================================================================== -->

<h1>{{DOC_TITLE}}</h1>
<div class="section-comment-toggle" data-section="doc — general">
  <button class="comment-btn" onclick="toggleComment(this)">&#128172;</button>
</div>
<div class="comment-area"><textarea placeholder="[doc — general] "></textarea></div>
<div class="version-stamp">{{PAGE_VERSION}} &middot; Updated: {{PAGE_UPDATED_AT}}</div>

<p>{{DOC_INTRO}}</p>

<!-- ===== GLOBAL COMMENT + COPY BUTTON — keep at bottom ===== -->
<div class="global-comment-section">
  <label>Global comment</label>
  <textarea id="global-comment" placeholder="[global] "></textarea>
</div>
<div class="copy-btn-wrapper">
  <button id="copy-btn" onclick="copyAllComments()">Copy all comments</button>
</div>

<script>
// THEME_KEY: change if you want per-doc storage namespacing
var THEME_KEY = 'lobster-doc-theme';

// ── Theme toggle ──
function toggleTheme() {
  var el = document.documentElement;
  var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  el.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
}
(function() {
  var saved = localStorage.getItem(THEME_KEY);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

// ── Per-section comment toggle ──
// Button lives inside .section-comment-toggle at end of section.
// .comment-area is the next sibling of that wrapper div.
function toggleComment(btn) {
  var toggle = btn.closest('.section-comment-toggle') || btn.parentElement;
  var area = toggle.nextElementSibling;
  if (!area || !area.classList.contains('comment-area')) {
    area = btn.parentElement.nextElementSibling;
  }
  if (area && area.classList.contains('comment-area')) {
    area.classList.toggle('open');
    if (area.classList.contains('open')) {
      var ta = area.querySelector('textarea');
      if (ta) ta.focus();
    }
  }
}

// ── Copy all non-empty comments ──
// Output format: "[label] text\n[label2] text2\n..."
function copyAllComments() {
  var lines = [];
  document.querySelectorAll('.comment-area textarea').forEach(function(ta) {
    var text = ta.value.trim();
    if (!text) return;
    var label = (ta.placeholder || '').replace(/\.\.\.$/, '').trim();
    lines.push(label + ' ' + text);
  });
  var globalEl = document.getElementById('global-comment');
  var globalText = globalEl ? globalEl.value.trim() : '';
  if (globalText) lines.push('[global] ' + globalText);

  var btn = document.getElementById('copy-btn');
  if (!lines.length) {
    btn.textContent = 'No comments yet';
    setTimeout(function() { btn.textContent = 'Copy all comments'; }, 1500);
    return;
  }

  navigator.clipboard.writeText(lines.join('\n')).then(function() {
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy all comments'; }, 1500);
  }).catch(function() {
    // Clipboard API fallback
    var ta = document.createElement('textarea');
    ta.value = lines.join('\n');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); btn.textContent = 'Copied!'; }
    catch(e) { btn.textContent = 'Copy failed'; }
    document.body.removeChild(ta);
    setTimeout(function() { btn.textContent = 'Copy all comments'; }, 1500);
  });
}
</script>

</body>
</html>
