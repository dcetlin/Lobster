patterns:
- description: 'Subagents complete (status=done) but leave no artifact evidence in
    the registry — artifacts field is null and outcome_category is null. This implies
    write_result was either not called or its payload was not intercepted by wos_completion.py.
    The original gap (PR #867) was fixed by PR #891 (2026-04-23). Detection heuristic
    was updated 2026-05-18 to use done_unverifiable count (done UoWs with no artifacts+outcome_category)
    instead of the broader ''shit count'', which produced false positives during periods
    of high TTL-exceeded failures unrelated to back-propagation.'
  first_detected: '2026-04-23'
  id: write_result_not_back_propagated
  issue_ref: null
  last_detected: '2026-04-23'
  name: write_result not back-propagated to executor output
  recurrence_count: 0
  severity: high
  status: open
  threshold: 1
- description: 'upgrade.sh migrations use bare python3 or python instead of uv run.
    The CLAUDE.md rule requiring uv run instead of python3 exists, but enforcement
    does not. Oracle review caught it in PR #866 learnings. This is a hygiene enforcement
    gap, not a knowledge gap — it has recurred 4 times.'
  first_detected: '2026-04-22'
  id: bare_python3_in_migrations
  issue_ref: null
  last_detected: '2026-05-31'
  name: bare python3 in upgrade.sh migrations
  recurrence_count: 5
  severity: medium
  status: open
  threshold: 2
- description: 'Oracle agents write to both decisions.md and oracle/verdicts/ simultaneously.
    PR #865 declared oracle/verdicts/pr-{N}.md as canonical. PR #875 deprecated decisions.md
    and archived it, but agent prompt templates were not audited to confirm decisions.md
    write paths were fully removed. The deprecation was structural but behavioral
    enforcement was not verified complete.'
  first_detected: '2026-04-22'
  id: oracle_dual_write_no_enforcement
  issue_ref: null
  last_detected: '2026-04-23'
  name: oracle dual-write (decisions.md + oracle/verdicts/) with no enforcement
  recurrence_count: 0
  severity: medium
  status: open
  threshold: 2
- description: rolling-summary.md exceeds 50 lines and is not overwritten on each
    session-consolidation run. Design decision (overwrite to 50-line snapshot) was
    agreed and recorded but no agent has been assigned to implement it. The bloat
    amplifies each compaction — each one costs more reconstruction overhead than necessary.
    This fix has been carried as a thread item for 3+ sessions.
  first_detected: '2026-04-21'
  id: rolling_summary_bloat
  issue_ref: null
  last_detected: '2026-05-31'
  name: rolling-summary.md bloat fix agreed but not automated
  recurrence_count: 4
  severity: medium
  status: open
  threshold: 2
- description: 'Cron heartbeats and health pings are written to the vector memory
    DB alongside meaningful semantic events, degrading memory retrieval signal-to-noise
    over time. The type discriminator (type: health_probe, type: cron_heartbeat) is
    already present in message metadata but not used as an ingestion filter gate.'
  first_detected: '2026-04-22'
  id: health_probe_memory_saturation
  issue_ref: null
  last_detected: '2026-04-23'
  name: health probes saturating vector memory
  recurrence_count: 0
  severity: low
  status: open
  threshold: 2
- description: 'A monitoring or sweep instruction queries an external resource (GitHub
    label, file path, API endpoint)

    without first verifying the resource exists. Empty results are treated as valid
    signal — the query

    returns zero items and the sweep reads this as "nothing to report," when the real
    condition is

    "the resource this sweep depends on does not exist." No error surfaces when the
    contract is broken.

    The sweep reads confidently and misreads.


    Concrete example: a sweep that counts open issues with label "wos:executing" will
    return zero if

    the label has been renamed or deleted — indistinguishable from a genuine zero-count.
    The sweep

    reported a throughput stall when the label had been renamed, not because throughput
    had stalled.


    Note on classification completeness: the write_result_not_back_propagated smell
    (PR #891/#867)

    is itself an instance of this class — the detection heuristic queried "shit count"
    without

    verifying that TTL-exceeded failures would not produce the same reading as back-propagation

    failures. The empty-contract and the empty-result were indistinguishable.

    '
  examples:
  - Sweep counts `gh issue list --label wos:executing` — label renamed → zero count
    → false stall report
  - write_result_not_back_propagated detection used 'shit count' which TTL-exceeded
    failures could also produce — contract between metric and failure class was never
    verified
  first_detected: '2026-05-18'
  fix_pattern: 'contract-declarations harness pattern (see sweep-instruction.template.md:
    Dependencies section)'
  id: legibility_failure/silent-contract-violation
  issue_ref: null
  last_detected: '2026-05-18'
  name: 'legibility failure: silent contract violation'
  recurrence_count: 0
  severity: high
  status: open
- description: 'A diagnostic or sweep agent classifies system state (stalled, healthy,
    failing, starved) without

    first reading the canonical operational state registry (e.g. wos-config.json).
    Valid operational

    states that exist only in the registry are invisible to the classifier — "deliberately
    paused"

    did not exist in the sweep''s conceptual space, so it misclassified a valid, intentional
    state

    as a stall and generated an incorrect prescription.


    This is a coherence failure: the classifier''s state space does not match the
    system''s actual

    state space. Any binary classifier (stalled/healthy) that uses elimination logic
    ("no throughput

    → stalled") will misclassify when a legitimate "no-throughput" state exists but
    is unknown to

    the classifier. The classifier asserted a conclusion via absence-of-evidence without
    first

    exhausting the alternative explanations that are knowable from the registry.


    Concrete example: sweep reported WOS throughput stall and escalated. wos-config.json
    had

    `execution_enabled: false` — a deliberate pause. The sweep had not read wos-config.json,
    so

    "deliberately paused" was not in its state enumeration. The escalation was spurious.

    '
  examples:
  - WOS throughput sweep classified zero-dispatch as stall without reading wos-config.json;
    execution_enabled=false was the actual state
  - Any binary health classifier (stalled/running) that does not enumerate deliberate-pause
    as a third state will misclassify a paused system as failing
  first_detected: '2026-05-18'
  fix_pattern: 'shared-state-registry-read and classification-completeness-invariant
    harness patterns (see sweep-instruction.template.md: Operational Posture and Classification
    States sections)'
  id: coherence_failure/missing-state-registry-read
  issue_ref: null
  last_detected: '2026-05-18'
  name: 'coherence failure: missing state registry read'
  recurrence_count: 0
  severity: high
  status: open
